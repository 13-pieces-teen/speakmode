<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>SpeakMode compact recorder · synthetic IPC</title></head><body><div id="root"></div>
<script type="module">
// Isolated browser-only fixture. No microphone, Key, clipboard or host input.
const clone=x=>structuredClone(x),modes=[['auto','自动'],['chat','聊天消息'],['document','文档写作'],['email','邮件沟通'],['technical','技术沟通']].map(([id,name])=>({id,name,baseMode:'auto',rules:'',revision:1,builtin:true}));
const session={id:'fixture',sessionId:'fixture',generation:7,state:'recording',workerReleased:false,level:.3,captions:[],partial:'',modeSnapshot:{...modes[0],modeId:'auto'}};
const snapshot={sequence:1,session,modes};let channel,callback=0,resizeId=0,inFlight=0,selectionAt=0,modeDelay=0;
const pending=new Map(),metrics={synthetic:true,resizeCalls:0,maxResizeInFlight:0,menuCloseMs:null,maxLongTaskMs:0,selectCalls:0,stopCalls:0,cancelCalls:0};
const report=()=>parent.postMessage({type:'metrics',metrics},location.origin);
const emit=()=>{channel?.onmessage({sequence:++snapshot.sequence,kind:'session',payload:clone(session),sessionId:session.id,generation:7});report();};
globalThis.isTauri=true;
window.__TAURI_INTERNALS__={transformCallback:()=>++callback,unregisterCallback:()=>{},invoke:async(cmd,args={})=>{
 if(cmd==='subscribe_state'){channel=args.channel;return clone(snapshot);}
 const {name,payload:p}=args.request;
 if(name==='state.snapshot')return clone(snapshot);
 if(name==='window.resizeRecorder'){
  metrics.resizeCalls++;inFlight++;metrics.maxResizeInFlight=Math.max(metrics.maxResizeInFlight,inFlight);const id=++resizeId;
  return new Promise(resolve=>{pending.set(id,resolve);parent.postMessage({type:'resize',id,...p},location.origin);report();});
 }
 if(name==='session.selectMode'){
  metrics.selectCalls++;selectionAt=performance.now();
  if(p.sessionId!==session.id||p.expectedGeneration!==7)throw Error('Wrong fixture identity');
  if(modeDelay)await new Promise(resolve=>setTimeout(resolve,modeDelay));
  const mode=modes.find(m=>m.id===p.modeId&&m.revision===p.revision);if(!mode)throw Error('Wrong fixture revision');
  session.modeSnapshot={...mode,modeId:mode.id};emit();return clone(session);
 }
 if(name==='session.stop'){metrics.stopCalls++;session.state='rewriting';emit();return null;}
 if(name==='session.cancel'){metrics.cancelCalls++;session.state='cancelled';session.workerReleased=true;emit();return null;}
 if(name==='session.captionRendered')return null;
 throw Error('Unexpected fixture command '+name);
}};
window.addEventListener('message',event=>{
 if(event.origin!==location.origin||event.source!==parent)return;const p=event.data;
 if(p.type==='resizeAck'){inFlight--;pending.get(p.id)?.(null);pending.delete(p.id);report();}
 if(p.type==='modeDelay'){modeDelay=p.value;}
 if(p.type==='caption'){session.captions=[{id:'caption',text:'这是隔离夹具的实时字幕。停顿时录音继续，展开阅读后再切换场合。'.repeat(5),revision:1,final:true,captureOrder:0}];emit();}
 if(p.type==='manyModes'){modes.push(...Array.from({length:18},(_,i)=>({id:'personal-'+i,name:i===0?'研究项目会议记录与跨团队同步专用场合':'个人场合 '+(i+1),baseMode:'auto',rules:'fixture',revision:1,builtin:false})));channel?.onmessage({sequence:++snapshot.sequence,kind:'changed',payload:null});}
 if(p.type==='error'){session.error='合成连接提示：请检查服务地域与网络。';session.recordingLimitRemainingMs=9000;emit();}
 if(p.type==='tray'){channel?.onmessage({sequence:++snapshot.sequence,kind:'recorder.openMode',payload:{sessionId:session.id,generation:7}});}
 if(p.type==='reset'){location.reload();}
});
new MutationObserver(()=>{if(selectionAt&&!document.querySelector('.recorder-mode-menu')){metrics.menuCloseMs=+(performance.now()-selectionAt).toFixed(2);selectionAt=0;report();}}).observe(document.body,{childList:true,subtree:true});
try{new PerformanceObserver(list=>{for(const e of list.getEntries())metrics.maxLongTaskMs=Math.max(metrics.maxLongTaskMs,e.duration);report();}).observe({entryTypes:['longtask']});}catch{}
await import('/src/main.tsx');
setInterval(()=>{if(session.state==='recording'){session.level=.1+Math.abs(Math.sin(performance.now()/550))*.25;channel?.onmessage({sequence:snapshot.sequence,kind:'level',payload:{sessionId:session.id,generation:7,level:session.level}});}},80);
</script></body></html>
