<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>SpeakMode compact recorder verification</title><style>body{margin:0;font:14px "Segoe UI",sans-serif;color:#28374b;background:#eaf0f5}header{padding:24px 32px;background:#fff}h1{font-size:20px}button{padding:7px 12px;margin:3px;border:1px solid #c7d3e1;background:#fff;border-radius:7px;cursor:pointer}main{height:460px;display:grid;place-items:end center;padding-bottom:22px;background:radial-gradient(ellipse at 50% 80%,#fafcff,#dfe9f1)}iframe{border:1px dashed #b4c4d4;display:block;border-radius:4px;width:240px;height:64px;background:transparent}pre{margin:16px 32px;font-size:12px}p{color:#64758b}</style><header><h1>SpeakMode · 紧凑录音浮层</h1><p>隔离浏览器夹具：边框表示原生窗口尺寸，不连接麦克风、服务或剪贴板。</p><button id="delay">尺寸与模式应答延迟 350ms</button><button id="caption">显示长字幕</button><button id="manyModes">增加 18 个个人场合</button><button id="error">显示错误与剩余时长</button><button id="tray">模拟托盘打开</button><button id="reset">重置录音</button></header><main><iframe id="recorder" title="隔离录音浮层" src="compact-recorder-browser-fixture.html?window=recorder"></iframe></main><pre id="metrics">等待真实 React 浮层…</pre><script>
const frame=document.getElementById('recorder');let delay=0;const send=data=>frame.contentWindow.postMessage(data,location.origin);for(const id of ['caption','manyModes','error','tray','reset'])document.getElementById(id).onclick=()=>send({type:id});document.getElementById('delay').onclick=()=>{delay=delay?0:350;send({type:'modeDelay',value:delay});document.getElementById('delay').textContent=delay?'恢复即时应答':'尺寸与模式应答延迟 350ms';};window.addEventListener('message',e=>{if(e.origin!==location.origin||e.source!==frame.contentWindow)return;const p=e.data;if(p.type==='metrics')document.getElementById('metrics').textContent=JSON.stringify({viewport:{width:frame.clientWidth,height:frame.clientHeight},...p.metrics},null,2);if(p.type==='resize')setTimeout(()=>{frame.style.width=p.width+'px';frame.style.height=p.height+'px';requestAnimationFrame(()=>send({type:'resizeAck',id:p.id}));},delay);});</script></html>
